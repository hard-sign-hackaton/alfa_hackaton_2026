openapi: 3.0.3
info:
  title: Alfa Hack 2026 — Web API
  version: 1.0.0
  description: |
    HTTP API веб-приложения Alfa Hack 2026. Спецификация описывает контракт,
    который использует React-интерфейс из `frontend/`, и служебные маршруты
    обратного поиска.

    Базовый адрес локального запуска — `http://127.0.0.1:8080`; фронтенд
    обращается к путям относительно `/api`. Аутентификации нет: приложение
    рассчитано на локальный запуск, а cookie `alfa_feedback` служит только
    анонимным идентификатором оценки, не авторизацией.

    Общие правила POST-запросов:

    * `Content-Type` должен быть `application/json` (параметр charset
      допускается); иначе возвращается `415`.
    * Тело запроса — JSON-объект размером от 1 до 16000 байт; иначе
      возвращается `413`, а для некорректного JSON или не-объекта — `400`.
    * Если браузер передал `Origin`, его netloc должен совпадать с `Host`;
      иначе возвращается `403`. Запросы без `Origin` (например, curl) разрешены.
    * Неизвестные поля, кроме перечисленных в схеме конкретного маршрута,
      отклоняются с `400`.

    Ошибки имеют единый вид `{"error": "<сообщение>"}`. JSON-ответы отдаются
    с `Cache-Control: no-store`, `X-Content-Type-Options: nosniff`,
    `Referrer-Policy: no-referrer` и строгой CSP.

    `POST /api/analysis`, `POST /api/chat` и `POST /api/matches` запускают
    фоновую задачу и возвращают `202` с объектом `Job`. Результат нужно
    забирать через `GET /api/jobs/{jobId}`. Для анализа после завершения
    задачи фронтенд заново запрашивает `GET /api/analysis`.
  license:
    name: Internal hackathon project
paths:
  /api/bootstrap:
    get:
      tags: [system]
      summary: Стартовые данные приложения
      operationId: getBootstrap
      description: |
        Возвращает компании, отраслевые профили для навигации, каталог
        банковских документов и состояние источников. Компании содержат
        `profile_id`, вычисленный по ОКВЭД.
      responses:
        '200':
          description: Стартовые данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/feed:
    get:
      tags: [feed]
      summary: Персональная лента новостей
      operationId: getFeed
      description: |
        Возвращает новости для выбранной компании, сохранённые разборы,
        признаки важности и сведения о связях. Если передан `demo_id`,
        в начало ленты добавляются карточки активного экспертного сценария.
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
        - $ref: '#/components/parameters/DemoIdQuery'
      responses:
        '200':
          description: Лента компании
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/analysis:
    get:
      tags: [analysis]
      summary: Сохранённый разбор новости
      operationId: getAnalysis
      description: |
        Возвращает полный разбор пары «компания — новость», исходное событие,
        версию разбора для оценки, банковский контекст и строку связи.
        `state` равен `null`, если разбора ещё нет. Для тестовой новости
        обязателен `demo_id`.
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
        - $ref: '#/components/parameters/NewsIdQuery'
        - $ref: '#/components/parameters/DemoIdQuery'
      responses:
        '200':
          description: Разбор или пустое состояние
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [analysis]
      summary: Запустить новый разбор
      operationId: startAnalysis
      description: |
        Ставит в очередь полный разбор пары «компания — новость». Повторный
        запрос той же пары во время выполнения возвращает существующую задачу.
        Тестовые новости обрабатываются автоматически и здесь не принимаются.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisStartRequest'
      responses:
        '202':
          description: Задача поставлена в очередь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/chat:
    post:
      tags: [chat]
      summary: Задать вопрос по разбору
      operationId: startChat
      description: |
        Запускает фоновый ответ по контексту выбранного разбора. Контекст и
        история диалога формируются сервером; клиент передаёт только вопрос.
        Для тестовой новости обязателен `demo_id`, а разбор должен быть готов.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatStartRequest'
      responses:
        '202':
          description: Задача чата поставлена в очередь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/jobs/{jobId}:
    get:
      tags: [jobs]
      summary: Состояние фоновой задачи
      operationId: getJob
      description: |
        Отдаёт текущее состояние задачи. Пока задача в `queued` или `running`,
        клиент опрашивает этот маршрут. Поля `answer`, `retrieved_sources`,
        `retrieval` появляются у чата, `matches` — у задачи подбора, а
        `error` — у неуспешной задачи.
      parameters:
        - name: jobId
          in: path
          required: true
          description: 32-символьный hex-идентификатор задачи
          schema:
            type: string
            pattern: '^[a-f0-9]{32}$'
      responses:
        '200':
          description: Состояние задачи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/matches:
    post:
      tags: [service]
      summary: Запустить подбор компаний для новости
      operationId: startMatches
      description: |
        Служебный маршрут обратного поиска. Запускает подбор компаний для
        новости и сохраняет связи; после завершения задачи результат доступен
        в поле `matches`. Текущий интерфейс этот маршрут напрямую не вызывает.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchesStartRequest'
      responses:
        '202':
          description: Задача подбора поставлена в очередь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/news-companies:
    get:
      tags: [service]
      summary: Компании, связанные с новостью
      operationId: getNewsCompanies
      description: |
        Обратный поиск: возвращает активные связи новости с компаниями.
        Для обычной новости достаточно `news_id`. Для тестовой новости
        дополнительно нужны `demo_id` и `company_id`. Текущий интерфейс
        использует этот маршрут только как служебный.
      parameters:
        - $ref: '#/components/parameters/NewsIdQuery'
        - $ref: '#/components/parameters/CompanyIdOptionalQuery'
        - $ref: '#/components/parameters/DemoIdQuery'
      responses:
        '200':
          description: Связанные компании
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsCompaniesResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/bank-sources:
    get:
      tags: [bank]
      summary: Банковские источники из готовых разборов
      operationId: getBankSources
      description: |
        Возвращает уникальные банковские фрагменты, найденные в сохранённых
        разборах. Элементы имеют `kind: bank` и пригодны для отображения в
        разделе «Банк».
      responses:
        '200':
          description: Список банковских фрагментов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Source'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/bank-document:
    get:
      tags: [bank]
      summary: Документ банка и его чанки
      operationId: getBankDocument
      description: |
        Возвращает карточку документа из манифеста и, если база доступна,
        до 500 чанков в исходном порядке. В режиме снимка или при недоступной
        базе возвращается `available: false` и пустой `chunks`, а не ошибка.
      parameters:
        - name: id
          in: query
          required: true
          description: Идентификатор документа из манифеста
          schema:
            type: string
      responses:
        '200':
          description: Документ и доступные чанки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankDocumentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/feedback:
    get:
      tags: [feedback]
      summary: Текущая оценка разбора
      operationId: getFeedback
      description: |
        Читает оценку для текущего анонимного посетителя. Если cookie
        `alfa_feedback` ещё нет, сервер создаёт 32-символьный reviewer id и
        устанавливает HttpOnly cookie `SameSite=Lax` на один год. Оценка
        привязана к паре «компания — новость» и версии разбора.
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
        - $ref: '#/components/parameters/NewsIdQuery'
        - $ref: '#/components/parameters/AnalysisVersionQuery'
        - $ref: '#/components/parameters/DemoIdQuery'
      responses:
        '200':
          description: Оценка или `null`
          headers:
            Set-Cookie:
              $ref: '#/components/headers/FeedbackCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [feedback]
      summary: Сохранить или удалить оценку
      operationId: saveFeedback
      description: |
        Сохраняет оценку `1` или `-1`, либо удаляет её при `vote: null`.
        `analysis_version` должен совпадать с текущей версией разбора, иначе
        возвращается `409`. Повторная оценка заменяет предыдущую.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '200':
          description: Сохранённая оценка
          headers:
            Set-Cookie:
              $ref: '#/components/headers/FeedbackCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/expert-demo:
    post:
      tags: [expert-demo]
      summary: Управление общим экспертным сценарием
      operationId: controlExpertDemo
      description: |
        Запускает, останавливает или повторяет общий сценарий тестовых
        новостей. `start` создаёт глобальный сеанс для всех компаний и
        возвращает его представление; повторный `start` возвращает активный
        сеанс. `stop` и `retry` требуют `demo_id` и возвращают соответственно
        `{"status":"stopped"}` или обновлённое представление сеанса.
        Для запуска нужны `LLM_API_KEY`, `EXPERT_DATABASE_URL`, доступная
        база и подготовленное хранилище связей.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpertDemoRequest'
      responses:
        '200':
          description: Сеанс сценария или подтверждение остановки
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DemoSession'
                  - $ref: '#/components/schemas/ExpertDemoStopped'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  parameters:
    CompanyIdQuery:
      name: company_id
      in: query
      required: true
      description: Идентификатор компании, например `U_37452`
      schema:
        type: string
    CompanyIdOptionalQuery:
      name: company_id
      in: query
      required: false
      description: Идентификатор компании; обязателен для тестовой новости
      schema:
        type: string
    NewsIdQuery:
      name: news_id
      in: query
      required: true
      description: Идентификатор публикации; для тестовой — `demo:<session>:<index>`
      schema:
        type: string
    DemoIdQuery:
      name: demo_id
      in: query
      required: false
      description: Идентификатор активного экспертного сценария
      schema:
        type: string
        pattern: '^[a-f0-9]{32}$'
    AnalysisVersionQuery:
      name: analysis_version
      in: query
      required: true
      description: SHA-256 версии разбора из `GET /api/analysis`
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'

  headers:
    FeedbackCookie:
      description: |
        Анонимный идентификатор посетителя. Устанавливается, если cookie ещё
        нет; HttpOnly, SameSite=Lax, Path=/, Max-Age=31536000.
      schema:
        type: string
        example: alfa_feedback=0123456789abcdef0123456789abcdef; Path=/; HttpOnly; SameSite=Lax; Max-Age=31536000

  responses:
    BadRequest:
      description: Некорректные поля, JSON или параметры запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Origin не совпадает с Host
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Компания, новость, документ или задача не найдены
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Состояние изменилось, сценарий завершён или разбор ещё не готов
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Тело запроса пустое или больше 16000 байт
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Ожидается Content-Type application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Уже выполняются два запроса или достигнут лимит диалогов
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Внутренняя ошибка без раскрытия секретов
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Недоступны модель, база, хранилище связей или настроен сценарий
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Понятное пользователю сообщение без внутренних деталей
      example:
        error: Компания не найдена

    JsonObject:
      type: object
      additionalProperties: true
      description: Свободный JSON-объект с полями соответствующего источника

    LinksSync:
      type: object
      required: [status, stage, updated_at]
      properties:
        status:
          type: string
          enum: [disabled, pending, running, done, failed]
        stage:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      example:
        status: done
        stage: Связи обновлены
        updated_at: '2026-10-26T09:56:54.291828+00:00'

    CompanyPayments:
      type: object
      description: |
        Агрегаты платежей компании из аналитического снимка. Набор полей
        может расширяться; фиксированные ниже — основные для интерфейса.
      properties:
        totals:
          type: object
          additionalProperties: true
          properties:
            edges_count:
              type: integer
            turnover_rub:
              type: number
            incoming_amount_rub:
              type: number
            outgoing_amount_rub:
              type: number
            intragroup_share_pct:
              type: number
            intragroup_amount_rub:
              type: number
            average_edge_amount_rub:
              type: number
            incoming_payments_count:
              type: integer
            outgoing_payments_count:
              type: integer
            unique_counterparties_count:
              type: integer
            external_counterparties_count:
              type: integer
            intragroup_counterparties_count:
              type: integer
        geography:
          type: object
          additionalProperties: true
          properties:
            top_cities:
              type: array
              items:
                $ref: '#/components/schemas/CityShare'
            top_regions:
              type: array
              items:
                $ref: '#/components/schemas/RegionShare'
        top_okved:
          type: array
          items:
            $ref: '#/components/schemas/OkvedShare'
        two_way_links:
          type: object
          additionalProperties: true
        counterparties:
          type: object
          additionalProperties: true
      additionalProperties: true

    CityShare:
      type: object
      properties:
        city: {type: string}
        share_pct: {type: number}
        amount_rub: {type: number}
        counterparties_count: {type: integer}
      additionalProperties: true

    RegionShare:
      type: object
      properties:
        region: {type: string}
        share_pct: {type: number}
        amount_rub: {type: number}
        counterparties_count: {type: integer}
      additionalProperties: true

    OkvedShare:
      type: object
      properties:
        share_pct: {type: number}
        amount_rub: {type: number}
        okved_name: {type: string}
        okved_class: {type: string}
        counterparties_count: {type: integer}
        top_codes:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              share_pct: {type: number}
              amount_rub: {type: number}
              okved_code: {type: string}
              okved_name: {type: string}
              counterparties_count: {type: integer}
      additionalProperties: true

    Company:
      type: object
      required: [id, industry, okved, region, revenue_rub, services, countries, stage]
