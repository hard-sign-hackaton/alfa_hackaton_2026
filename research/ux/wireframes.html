<div class="app"><header><div class="brand"><span class="logo" aria-hidden="true">А</span> Альфа-Бизнес <span class="muted">/ Аналитика</span></div><div class="company">ООО «УралКонструкции»</div><div class="demo">Демо · условная компания · черновая схема</div></header><div id="view"></div></div>
<div class="composer hidden" id="composer"><form id="form"><input id="input" aria-label="Вопрос по новости" placeholder="Спросить об этой новости…" autocomplete="off"><button class="send" aria-label="Отправить вопрос">↑</button></form><small>Демонстрация: ответы подготовлены заранее, AI не подключён</small></div>
<template id="analysis"><div class="card ai"><span class="label">Вывод AI · условный</span><p>Охлаждение спроса на сталь может указывать на давление на новые заказы. Влияние на вашу компанию зависит от состава заказчиков и условий контрактов. <a class="ref" href="#source-1">[1]</a></p></div>
<section class="card"><div class="eyebrow">Факты источника</div><h3>Прогноз потребления стали пересмотрен</h3><p>«Северсталь» оценивает снижение потребления стали в России в 2026 году в 0,5% и ожидает сезонного охлаждения в IV квартале. Это прогноз компании, а не итог года. <a class="ref" href="#source-1">[1]</a></p><details><summary class="muted">Оригинальный заголовок</summary><p id="original-title"></p></details></section>
<section class="card"><h3>Почему это касается вас</h3><div class="feature"><span>Отрасль · демо-профиль</span><b>Металлоконструкции</b></div><div class="feature"><span>Регион · демо-профиль</span><b>Свердловская обл.</b></div><div class="feature"><span>Выручка · 2025 · демо</span><b>18 млрд ₽</b></div><p class="muted">Связь с рынком стали — отраслевой сигнал. Регион и размер задают контекст, но сами не доказывают эффект.</p><div class="rule"></div><p><b>Почему высокая важность</b></p><p class="muted">Сигнал связан с основной деятельностью компании. Оценка демонстрационная; состав заказчиков ещё не известен.</p></section>
<section class="card"><span class="label">Последствия · выводы AI</span><h3 style="margin-top:10px">Горизонт: IV квартал 2026</h3><p><b>Риск.</b> Возможное замедление новых заказов, если заказчики сокращают проекты. Это требует проверки. <a class="ref" href="#source-1">[1]</a></p><p><b>Возможность.</b> Проверить предложения поставщиков: при охлаждении рынка условия закупок могут измениться. Снижение цен не установлено.</p><div class="note"><b>Эффект в рублях пока не оценён</b><br>Нужны портфель заказов, цены и объём закупок. Прогноз −0,5% по рынку нельзя переносить на вашу выручку.</div></section>
<section class="card bank"><div class="eyebrow">Позиция Альфа-Банка</div><h3>Релевантный материал не найден</h3><p class="muted">В демонстрационном наборе нет материала банка по этому событию. Выводы выше подготовлены для примера и не выражают позицию банка.</p></section>
<section class="card"><span class="label">AI · что проверить</span><ol class="checks"><li>Портфель заказов на IV квартал: сроки и возможные переносы.</li><li>Долю заказчиков из отраслей, чувствительных к спросу на сталь.</li><li>Условия пересмотра закупочных цен и запас металла.</li></ol></section>
<section class="card source" id="source-1"><h3>Источники и основания</h3><a id="article-link" target="_blank" rel="noopener">[1] Коммерсантъ · материал о прогнозе спроса на сталь</a><small id="article-date"></small><p class="muted">Компания: вымышленный демо-профиль. Материал банка не использован.</p><p class="muted">Разбор: демо v1 · подготовлен 20.10.2026. Причинная связь требует уточнения.</p></section></template>
<script>
const eventData = {title:'Спрос на сталь в России в 2026 году может снизиться на 0,5% год к году',url:'https://www.kommersant.ru/doc/9043090',date:'20.10.2026'};
let screen=new URLSearchParams(location.search).get('screen')||'feed';let messages=[];let expanded=false;let pending=false;let failNext=false;
const view=document.getElementById('view'),composer=document.getElementById('composer'),input=document.getElementById('input');
function analysis(){return document.getElementById('analysis').innerHTML.replace('id="original-title"></p>','id="original-title">'+eventData.title+'</p>').replace('id="article-link"','href="'+eventData.url+'" id="article-link"').replace('id="article-date"></small>','id="article-date">Опубликовано: '+eventData.date+' · дата из локального набора</small>')}
function go(s){screen=s;history.replaceState(null,'','?screen='+s);render();window.scrollTo(0,0)}
function render(){document.body.dataset.screen=screen;composer.classList.toggle('hidden',screen==='feed');if(screen==='feed'){view.innerHTML=`<main><div class="eyebrow">Персональная лента</div><h2>Для вашего бизнеса</h2><article class="card"><span class="badge">Высокая важность</span><h1>Возможное давление на новые заказы</h1><p>«Северсталь» ожидает сезонного охлаждения спроса на сталь.</p><div class="meta">Коммерсантъ · ${eventData.date}</div><button class="primary" onclick="go('detail')">Открыть разбор</button></article><p class="footer">Заголовок — демонстрационный вывод AI.<br>Важность — пример для проверки интерфейса.</p></main>`}else if(screen==='detail'){view.innerHTML=`<main><button class="back" onclick="go('feed')">← К ленте</button><div style="margin-top:14px"><span class="badge">Высокая важность</span></div><h1>Возможное давление на новые заказы</h1>${analysis()}<div class="suggestions"><button onclick="ask('Что проверить в первую очередь?')">Что проверить в первую очередь?</button><button onclick="ask('Какие данные нужны для оценки эффекта?')">Какие данные нужны для оценки эффекта?</button><button onclick="ask('Почему это касается нашей компании?')">Почему это касается нашей компании?</button></div></main>`}else{view.innerHTML=`<div class="fold"><button class="back" onclick="go('detail')">← К разбору</button><strong>Возможное давление на новые заказы</strong><button id="expand" aria-expanded="${expanded}" onclick="expanded=!expanded;render()">${expanded?'Свернуть':'Развернуть'} аналитику</button></div>${expanded?'<main>'+analysis()+'</main>':''}<main><div class="chat-heading">Контекст: компания + событие + разбор</div><div id="messages"></div><div class="chat-sources" id="chat-source"><a href="${eventData.url}" target="_blank" rel="noopener">[1] Коммерсантъ · ${eventData.date}</a><br>Позиция банка не найдена в демо-наборе.</div><button class="state-link" onclick="failNext=true;this.textContent='Следующий запрос покажет ошибку'">Проверить состояние ошибки</button></main>`;let list=document.getElementById('messages');for(let m of messages){let el=document.createElement('div');el.className='message '+m.role;let label=document.createElement('div');label.className='label';label.textContent=m.role==='user'?'Вы · только этот диалог':'AI · демонстрационный ответ';el.append(label,document.createTextNode(m.text));if(m.role!=='user'){let a=document.createElement('a');a.href='#chat-source';a.textContent=' [1]';a.className='ref';el.append(a)}list.append(el)}if(pending)list.insertAdjacentHTML('beforeend','<p role="status">Готовим ответ…</p>');if(window.failed)list.insertAdjacentHTML('beforeend','<div class="error" role="alert">Не удалось получить ответ. Сообщение сохранено.<button class="primary" onclick="retry()">Повторить</button></div>')}
document.querySelector('.send').disabled=pending;}
function answer(text){if(/данн|оцен|руб/i.test(text))return 'Для расчёта нужны объём и цены закупок, портфель заказов и период оценки. По отраслевому прогнозу нельзя вычислить изменение вашей выручки. Уточнения учту только в этом диалоге.';return 'Проверьте портфель заказов и условия пересмотра цен. Прогноз источника касается рынка стали, а не вашей выручки. Какова доля заказов от строительства? Уточнение будет учтено со слов пользователя только в этом диалоге.'}
function ask(text){if(pending||!text.trim())return;messages.push({role:'user',text:text.trim()});input.value='';screen='chat';expanded=false;window.failed=false;pending=true;render();window.scrollTo(0,document.body.scrollHeight);setTimeout(()=>{pending=false;if(failNext){failNext=false;window.failed=true}else messages.push({role:'assistant',text:answer(text)});render();window.scrollTo(0,document.body.scrollHeight)},350)}
function retry(){if(pending)return;window.failed=false;pending=true;render();setTimeout(()=>{pending=false;messages.push({role:'assistant',text:answer(messages.filter(m=>m.role==='user').at(-1).text)});render()},350)}
document.getElementById('form').onsubmit=e=>{e.preventDefault();ask(input.value)};
if(screen==='chat')messages=[{role:'user',text:'Что проверить в первую очередь?'},{role:'assistant',text:answer('Что проверить в первую очередь?')}];
if(!['feed','detail','chat'].includes(screen))screen='feed';render();
</script><script src="demo-news.js"></script></html>
